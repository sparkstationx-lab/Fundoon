<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1a1d24"/>
      <stop offset="50%" stopColor="#14161d"/>
      <stop offset="100%" stopColor="#0f1014"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4"/>
      <stop offset="50%" stopColor="#3b82f6"/>
      <stop offset="100%" stopColor="#6366f1"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b"/>
      <stop offset="100%" stopColor="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Matte Charcoal Rounded Container -->
  <rect width="800" height="300" rx="32" fill="url(#bgGrad)" stroke="#2e323f" stroke-width="3"/>

  <!-- Glowing Emblem / Logo Mark on Left -->
  <g transform="translate(60, 50)">
    <!-- Outer Shield / Hexagon -->
    <rect x="0" y="0" width="200" height="200" rx="40" fill="#1e222d" stroke="url(#cyanBlue)" stroke-width="4" filter="url(#glow)"/>
    <rect x="10" y="10" width="180" height="180" rx="32" fill="#13151b" />

    <!-- Ambient Glow behind controller -->
    <circle cx="100" cy="100" r="50" fill="#06b6d4" opacity="0.25" filter="url(#glow)"/>

    <!-- Modern Gamepad Vector -->
    <g transform="translate(40, 55)">
      <!-- Gamepad Body -->
      <path d="M20 30 C12 45 15 68 25 70 C33 71 38 58 45 52 C50 49 70 49 75 52 C82 58 87 71 95 70 C105 68 108 45 100 30 C95 20 80 18 60 18 C40 18 25 20 20 30 Z" fill="#ffffff" />
      <path d="M35 38 C42 34 78 34 85 38 C82 50 78 58 75 58 C72 58 70 54 60 54 C50 54 48 58 45 58 C42 58 38 50 35 38 Z" fill="#0f172a" />
      <!-- D-Pad -->
      <rect x="28" y="32" width="6" height="16" rx="2" fill="#06b6d4"/>
      <rect x="23" y="37" width="16" height="6" rx="2" fill="#06b6d4"/>
      <!-- Action Buttons -->
      <circle cx="86" cy="35" r="3" fill="#ef4444"/>
      <circle cx="92" cy="40" r="3" fill="#3b82f6"/>
      <circle cx="80" cy="40" r="3" fill="#10b981"/>
      <circle cx="86" cy="45" r="3" fill="#f59e0b"/>
      <!-- Glowing Sticks -->
      <circle cx="48" cy="50" r="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="72" cy="50" r="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <!-- Snooker Ball & Cue Motif at bottom of mark -->
    <circle cx="100" cy="155" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="98" cy="152" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="75" cy="158" r="8" fill="#eab308"/>
    <circle cx="125" cy="158" r="8" fill="#0284c7"/>
    <line x1="45" y1="168" x2="155" y2="148" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Brand Zone -->
  <g transform="translate(300, 75)">
    <!-- Main Wordmark FUNDOON -->
    <text x="0" y="85" font-family="Outfit, sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="4">
      FUNDOO<tspan fill="#22d3ee">N</tspan>
    </text>

    <!-- Subtitle: GAMES & CAFÉ -->
    <text x="5" y="135" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#94a3b8" letter-spacing="10">
      GAMES <tspan fill="#f59e0b">&amp;</tspan> CAFÉ
    </text>

    <!-- Sleek Accent Line -->
    <rect x="5" y="152" width="400" height="4" rx="2" fill="url(#cyanBlue)"/>
  </g>
</svg>
